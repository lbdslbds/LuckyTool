name: Build APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - both

jobs:
  build:
    name: Build LuckyTool APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Keystore & Signing Properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PROGUARD_CUSTOM_BASE64: ${{ secrets.PROGUARD_CUSTOM_BASE64 }}
        run: |
          mkdir -p keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
            echo "storeFile=../keystore/release.jks" > keystore/keystore.properties
            echo "storePassword=$KEYSTORE_PASSWORD" >> keystore/keystore.properties
            echo "keyAlias=$KEY_ALIAS" >> keystore/keystore.properties
            echo "keyPassword=$KEY_PASSWORD" >> keystore/keystore.properties
          else
            echo "No keystore secret found, generating temporary keystore for CI build..."
            keytool -genkey -v \
              -keystore keystore/ci_temp.jks \
              -alias luckytool_ci \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass 123456 \
              -keypass 123456 \
              -dname "CN=LuckyTool CI, OU=LuckyTool, O=LuckyTool, L=Unknown, ST=Unknown, C=CN"
            
            echo "storeFile=../keystore/ci_temp.jks" > keystore/keystore.properties
            echo "storePassword=123456" >> keystore/keystore.properties
            echo "keyAlias=luckytool_ci" >> keystore/keystore.properties
            echo "keyPassword=123456" >> keystore/keystore.properties
          fi

          if [ -n "$PROGUARD_CUSTOM_BASE64" ]; then
            echo "$PROGUARD_CUSTOM_BASE64" | base64 -d > keystore/proguard-custom.txt
          else
            touch keystore/proguard-custom.txt
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: |
          BUILD_TYPE="${{ inputs.build_type || 'release' }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Pull request detected, building debug..."
            ./gradlew assembleDebug --stacktrace
          elif [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleDebug --stacktrace
          elif [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease --stacktrace
          elif [ "$BUILD_TYPE" = "both" ]; then
            ./gradlew assembleDebug assembleRelease --stacktrace
          else
            ./gradlew assembleRelease --stacktrace
          fi

      - name: Collect APKs
        run: |
          mkdir -p dist
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} dist/ \;
          echo "### 📦 Generated APK Files" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          for f in dist/*.apk; do
            if [ -f "$f" ]; then
              filename=$(basename "$f")
              filesize=$(ls -lh "$f" | awk '{print $5}')
              echo "| \`$filename\` | $filesize |" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: LuckyTool-APKs
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish to Tagged Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Snapshot Release (Direct .apk Download)
        if: "!startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: snapshot
          name: "LuckyTool Latest Build (Snapshot)"
          body: |
            ### 🚀 LuckyTool 自动构建产物 (Direct APK)
            - **Commit**: ${{ github.sha }}
            - **触发分支/事件**: ${{ github.ref_name }} (${{ github.event_name }})
            - **构建时间**: ${{ github.event.head_commit.timestamp || 'N/A' }}

            > 提示：下方 Assets 列表中提供直接可安装的 `.apk` 安装包，点击即可直接下载，无需解压！
          prerelease: true
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
